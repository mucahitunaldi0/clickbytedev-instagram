<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../sablon/brand.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  .zemin { padding: 200px 84px 240px; }
  .telefon img { position: absolute; top: calc(var(--h) * 0.016); left: calc(var(--h) * 0.016); width: calc(100% - var(--h) * 0.032); height: calc(100% - var(--h) * 0.032); opacity: 0; }
  .adimlar { position: relative; height: 60px; }
  .adim { position: absolute; inset: 0; text-align: center; font: 800 52px/1.1 'Bricolage Grotesque', sans-serif; opacity: 0; }
  .adim b { color: var(--camgobegi); font-weight: 800; }
</style>
</head>
<body>
<div class="zemin">
  <div class="uygulama-ad" id="e"><img class="ikon" src="../../assets/uygulamalar/snapburn/ikon.png" alt="">Snapburn</div>
  <h1 class="baslik" id="b">Kalori için <em>3 adım</em></h1>
  <div class="sahne">
    <div class="telefon" id="t" style="--h:860px">
      <img id="m1" src="../../assets/uygulamalar/snapburn/ekran-2.jpg" alt="">
      <img id="m2" src="../../assets/uygulamalar/snapburn/ekran-3.jpg" alt="">
      <img id="m3" src="../../assets/uygulamalar/snapburn/ekran-1.jpg" alt="">
    </div>
  </div>
  <div class="adimlar">
    <div class="adim" id="a1"><b>1.</b> Tabağı çekin</div>
    <div class="adim" id="a2"><b>2.</b> Kaloriyi görün</div>
    <div class="adim" id="a3"><b>3.</b> Günlüğe ekleyin</div>
    <div class="adim" id="s">Google Play'de <b>ücretsiz</b></div>
  </div>
  <div class="alt"><span class="logo">click<b>byte</b>dev</span><span>clickbytedev.com</span></div>
</div>
<script>
  window.REEL_SURE_MS = 15000;
  window.oynat = () => {
    const tl = gsap.timeline();
    tl.from('#e', { opacity: 0, y: 20, duration: 0.4 })
      .from('#b', { opacity: 0, y: 40, duration: 0.6, ease: 'power3.out' })
      .from('#t', { opacity: 0, y: 80, duration: 0.7, ease: 'power3.out' }, '-=0.2')
      .to('#m1', { opacity: 1, duration: 0.01 }, '<')
      .to('#a1', { opacity: 1, duration: 0.4 });
    [2, 3].forEach(i => {
      tl.to(`#m${i - 1}`, { opacity: 0, duration: 0.4 }, '+=2.2')
        .to(`#m${i}`, { opacity: 1, duration: 0.4 }, '<')
        .to(`#a${i - 1}`, { opacity: 0, y: -10, duration: 0.3 }, '<')
        .to(`#a${i}`, { opacity: 1, duration: 0.4 }, '<0.2');
    });
    tl.to('#a3', { opacity: 0, y: -10, duration: 0.3 }, '+=2.2')
      .to('#s', { opacity: 1, duration: 0.4 })
      .to({}, { duration: 3 });
    return tl;
  };
</script>
</body>
</html>
