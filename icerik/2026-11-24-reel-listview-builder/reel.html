<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../sablon/brand.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  .zemin { padding: 260px 84px 300px; justify-content: center; }
  .imlec { display: inline-block; width: 16px; height: 34px; background: var(--mavi); vertical-align: middle; }
</style>
</head>
<body>
<div class="zemin">
  <div class="etiket" id="e">// 15 saniyede flutter</div>
  <h1 class="baslik" id="b">Liste <em>kasıyor</em> mu?</h1>
  <pre class="kod" id="kod"></pre>
  <h2 class="altbaslik" id="s" style="opacity:0"><em style="font-style:normal;color:var(--mavi)">ListView.builder</em> sadece ekrandakini çizer.</h2>
  <div class="alt"><span class="logo">click<b>byte</b>dev</span><span>takip et → daha fazlası</span></div>
</div>
<script>
  window.REEL_SURE_MS = 15000;
  const satirlar = "Widget liste(List<String> urunler) {\n  return ListView.builder(\n    itemCount: urunler.length,\n    itemBuilder: (context, i) {\n      return ListTile(title: Text(urunler[i]));\n    },\n  );\n}";
  window.oynat = () => {
    const kod = document.getElementById('kod');
    const tl = gsap.timeline();
    tl.from('#e', { opacity: 0, y: 20, duration: 0.4 })
      .from('#b', { opacity: 0, y: 40, duration: 0.6, ease: 'power3.out' })
      .to({ n: 0 }, {
        n: satirlar.length, duration: 4, ease: 'none',
        onUpdate() { kod.innerHTML = satirlar.slice(0, Math.round(this.targets()[0].n)) + '<span class="imlec"></span>'; }
      }, '+=0.3')
      .to('#s', { opacity: 1, y: -10, duration: 0.6 }, '+=0.4')
      .to({}, { duration: 8.7 });
    return tl;
  };
</script>
</body>
</html>
